<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理画面 | 全国大会アンケートプロジェクト</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell page-shell--wide">
      <section class="intro-panel results-panel">
        <p class="eyebrow">Admin</p>
        <h1>データ削除</h1>

        <form class="admin-login" id="admin-login">
          <label for="admin-id">ID</label>
          <input id="admin-id" name="adminId" autocomplete="username" required>

          <label for="admin-password">Password</label>
          <input id="admin-password" name="adminPassword" type="password" autocomplete="current-password" required>

          <button type="submit">ログイン</button>
          <p class="message" id="admin-message" role="status" aria-live="polite"></p>
        </form>

        <section id="admin-panel" hidden>
          <div class="summary-row" id="admin-summary"></div>
          <div class="submission-list" id="admin-list"></div>
        </section>
      </section>
    </main>
    <script src="admin.js"></script>
  </body>
</html>
