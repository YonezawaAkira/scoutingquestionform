<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>実施したいプログラム・プロジェクト | スカウト質問フォーム</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <form class="question-card" data-question-id="question-4">
        <p class="eyebrow">Question 04</p>
        <h1>いつかこんなプログラム・プロジェクトを実施したい！</h1>

        <label for="name">お名前</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="例：山田 太郎">

        <label for="answer">回答</label>
        <textarea id="answer" name="answer" rows="9" required placeholder="自由に書いてください"></textarea>

        <button type="submit">回答を送信</button>
        <p class="message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
