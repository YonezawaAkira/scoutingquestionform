<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>知識・経験が生きた瞬間 | スカウト質問フォーム</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <form class="question-card" data-question-id="question-2">
        <p class="eyebrow">Question 02</p>
        <h1>人生で最もボーイスカウトの知識・経験が生きた瞬間は？</h1>

        <label for="answer">回答</label>
        <textarea id="answer" name="answer" rows="9" required placeholder="節度を持って楽しく自由に回答して下さい"></textarea>

        <button type="submit">回答を送信</button>
        <p class="message" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
